name: RSTA-025 Independent RNCP Capability Gate Primitive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rsta/capability-gate.mjs'
      - 'rsta/verified-anchor.mjs'
      - '.github/workflows/rsta-025-capability-gate-primitive.yml'

permissions:
  contents: write

jobs:
  primitive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify primitive and fail-closed invariants
        run: |
          set -euo pipefail
          node > rsta025-final-verdict.json <<'JS'
          import crypto from 'node:crypto';
          import {
            CAPABILITY_STATE,
            createCapabilityIssuer,
            generateIssuerKeyPair,
            verifyCapabilityOffline,
          } from './rsta/capability-gate.mjs';
          import {
            createAnchorVerifier,
            generateAnchorVerifierKeyPair,
          } from './rsta/verified-anchor.mjs';

          const COMMITMENT='RSTA-025-PRIMITIVE-COMMITMENT-001';
          const ACTION='RSTA025_PRIMITIVE_EXECUTION';

          const avKeys=generateAnchorVerifierKeyPair();
          const anchorVerifier=createAnchorVerifier({privateKey:avKeys.privateKey,publicKey:avKeys.publicKey,verifierId:'RNCP-ANCHOR-VERIFIER-RSTA025'});
          const anchor=anchorVerifier.attest({core:{chain:'drand-test-chain-rsta025',round:9001,signature:'aa'.repeat(96),previous_signature:'bb'.repeat(96)}});

          const {publicKey,privateKey}=generateIssuerKeyPair();
          const gate=createCapabilityIssuer({privateKey,publicKey});
          const token=gate.issue({commitment:COMMITMENT,action:ACTION,anchor,anchorVerifierPublicKeyPem:anchorVerifier.publicKeyPem,nonce:'rsta025-fixed-nonce'});
          if(token.state!==CAPABILITY_STATE.CAPABILITY_UNLOCKED) throw new Error('baseline token did not unlock');

          const baseline=gate.verifyCapability(token,{commitment:COMMITMENT,action:ACTION});
          if(!baseline.valid) throw new Error(`baseline verification failed: ${baseline.code}`);
          const execution=gate.beginExecution(token,{commitment:COMMITMENT,action:ACTION});
          if(execution.state!==CAPABILITY_STATE.EXECUTED) throw new Error('execution did not reach EXECUTED');

          const negatives={};
          const checkReject=(name,candidate,request={commitment:COMMITMENT,action:ACTION})=>{
            const result=gate.verifyCapability(candidate,request);
            if(result.valid||result.code==='ACCEPT') throw new Error(`negative accepted: ${name}`);
            negatives[name]=result;
          };
          checkReject('forged_unlock_object',{...token,state:CAPABILITY_STATE.CAPABILITY_UNLOCKED,token_signature:'00'.repeat(64)});
          checkReject('copied_token_payload_change',{...token,action:'DIFFERENT_ACTION'});
          checkReject('wrong_commitment',{...token},{commitment:'DIFFERENT_COMMITMENT',action:ACTION});
          checkReject('wrong_action',{...token},{commitment:COMMITMENT,action:'DIFFERENT_ACTION'});
          checkReject('tampered_token_signature',{...token,token_signature:'00'.repeat(64)});
          checkReject('tampered_anchor_binding',{...token,anchor_evidence_hash:'00'.repeat(32)});
          checkReject('invalid_state',{...token,state:CAPABILITY_STATE.PENDING});
          const replay=gate.verifyCapability(token,{commitment:COMMITMENT,action:ACTION});
          if(replay.valid||replay.code!=='TOKEN_REPLAY') throw new Error(`replay not rejected: ${replay.code}`);
          negatives.replay=replay;

          let directExecRejected=false;
          try{gate.beginExecution({...token,token_signature:'00'.repeat(64)},{commitment:COMMITMENT,action:ACTION});}catch(e){directExecRejected=true;}
          if(!directExecRejected) throw new Error('direct execution bypass succeeded');

          const offline=verifyCapabilityOffline({token,publicKeyPem:gate.publicKeyPem,commitment:COMMITMENT,action:ACTION});
          if(offline.decision!=='ACCEPT'||!offline.signature_valid||!offline.binding_valid||!offline.token_id_valid) throw new Error('offline verifier failed baseline');

          const final={
            rsta:'RSTA-025',status:'PASS',primitive:'rsta/capability-gate.mjs',anchor_contract:'RNCP-VERIFIED-ANCHOR-v1',
            baseline:{issued:true,state:token.state,verified:baseline.valid,execution:execution.state},offline_verifier:offline,negative_controls:negatives,
            invariants:{capability_unlocked_requires_signed_verified_anchor:true,signed_capability_required_for_execution:true,commitment_and_action_bound:true,direct_unlock_object_rejected:true,replay_rejected:true,offline_signature_verification_passed:true,all_negative_controls_rejected:Object.values(negatives).every(x=>x&&x.code!=='ACCEPT'),direct_execution_bypass_rejected:directExecRejected},
            evidence_hash:crypto.createHash('sha256').update(JSON.stringify({anchor,token,baseline,execution,negatives,offline,directExecRejected})).digest('hex')
          };
          console.log(JSON.stringify(final,null,2));
          JS

      - name: Persist verdict
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rsta025-final-verdict.json
          git commit -m 'rsta: persist RSTA-025 updated VerifiedAnchor verdict [skip ci]'
          git push origin HEAD:main
