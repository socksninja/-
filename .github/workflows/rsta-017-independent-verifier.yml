name: RSTA-017 Independent Receipt Verifier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-portable-receipt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence
        uses: actions/checkout@v4
      - name: Verify receipt integrity independently
        run: |
          python3 - <<'PY'
          import hashlib, json

          def canonical(v):
              if v is None or not isinstance(v, (dict, list)):
                  return json.dumps(v, separators=(',', ':'), ensure_ascii=False)
              if isinstance(v, list):
                  return '[' + ','.join(canonical(x) for x in v) + ']'
              return '{' + ','.join(json.dumps(k, ensure_ascii=False, separators=(',', ':')) + ':' + canonical(v[k]) for k in sorted(v)) + '}'

          def sha(v):
              return hashlib.sha256(canonical(v).encode()).hexdigest()

          with open('rsta/rsta016-live-evidence.json', encoding='utf-8') as f:
              evidence = json.load(f)
          r = evidence['remote_receipt']
          c = evidence['commitment']

          assert r['decision'] == 'ACCEPT'
          assert r['capability'] == 'EXECUTED'
          assert r['protocol_version'] == 'RNCP-PORTABLE-1' if 'protocol_version' in r else True

          commitment_envelope = {
              'protocol_version': 'RNCP-PORTABLE-1',
              'commitment_id': c['commitment_id'],
              'action': c['action'],
              'payload': c['payload'],
          }
          commitment_hash = sha(commitment_envelope)
          assert commitment_hash == r['commitment_hash'], (commitment_hash, r['commitment_hash'])

          unsigned = dict(r)
          unsigned.pop('receipt_hash')
          receipt_hash = sha(unsigned)
          assert receipt_hash == r['receipt_hash'], (receipt_hash, r['receipt_hash'])

          tampered = json.loads(json.dumps(unsigned))
          tampered['observed']['payload']['message'] = 'TAMPERED'
          tampered_hash = sha(tampered)
          assert tampered_hash != r['receipt_hash']

          print('RSTA-017=PASS')
          print('verifier_runtime=github-actions/ubuntu-latest')
          print('receipt_source=public-github-commit')
          print('commitment_hash_match=true')
          print('receipt_hash_match=true')
          print('tamper_reject=true')
          print('commitment_hash=' + commitment_hash)
          print('receipt_hash=' + receipt_hash)
          print('tampered_hash=' + tampered_hash)
          PY
