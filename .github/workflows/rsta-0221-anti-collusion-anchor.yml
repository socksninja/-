name: RSTA-022.1 Anti-Collusion External Anchor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rsta-0221-anti-collusion-anchor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned workflow commit
        uses: actions/checkout@v4

      - name: Execute independent quorum and external anchor verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, hashlib, json, urllib.request
          from pathlib import Path

          def canonical(v):
              if isinstance(v, dict):
                  return '{' + ','.join(json.dumps(k, ensure_ascii=False, separators=(',', ':')) + ':' + canonical(v[k]) for k in sorted(v)) + '}'
              if isinstance(v, list):
                  return '[' + ','.join(canonical(x) for x in v) + ']'
              return json.dumps(v, ensure_ascii=False, separators=(',', ':'))
          def sha(v):
              return hashlib.sha256(canonical(v).encode()).hexdigest()

          expected = {
              'protocol_version': 'RNCP-PORTABLE-1',
              'commitment_id': 'RSTA-022.1-ANTI-COLLUSION-001',
              'action': 'POSTMAN_ECHO',
              'payload': {'message': 'RSTA-022.1 anchored reality'}
          }
          expected_hash = sha(expected)

          def receipt(executor, implementation, observed, decision='ACCEPT', capability='EXECUTED'):
              core = {
                  'protocol_version': expected['protocol_version'],
                  'commitment_id': expected['commitment_id'],
                  'commitment_hash': expected_hash,
                  'execution_id': f'{executor}:{expected["commitment_id"]}',
                  'executor_id': executor,
                  'implementation': implementation,
                  'transport': 'LOCAL_CI_RUNTIME',
                  'observed': observed,
              }
              return {**core, 'decision': decision, 'capability': capability, 'receipt_hash': sha(core)}

          honest_payload = {'status':'EXECUTED','action':expected['action'],'payload':expected['payload']}
          conflict_payload = {'status':'EXECUTED','action':expected['action'],'payload':{'message':'CONFLICT-C'}}
          false_payload = {'status':'EXECUTED','action':expected['action'],'payload':{'message':'FALSE-REALITY'}}

          a = receipt('rsta0221-honest-a','standalone-python',honest_payload)
          b = receipt('rsta0221-honest-b','standalone-node',honest_payload)
          c = receipt('rsta0221-conflict-c','standalone-python-conflict',conflict_payload,'CONFLICT','NONE')
          ca = receipt('rsta0221-colluder-a','standalone-colluder-python',false_payload)
          cb = receipt('rsta0221-colluder-b','standalone-colluder-node',false_payload)

          def integrity(r):
              core = {k:r[k] for k in ['protocol_version','commitment_id','commitment_hash','execution_id','executor_id','implementation','transport','observed']}
              return sha(core) == r['receipt_hash'] and r['commitment_hash'] == expected_hash
          assert all(integrity(x) for x in [a,b,c,ca,cb])

          anchor_payload = {
              'commitment_id': expected['commitment_id'],
              'action': expected['action'],
              'message': expected['payload']['message'],
          }
          req = urllib.request.Request(
              'https://httpbin.org/post',
              data=json.dumps(anchor_payload).encode(),
              headers={'Content-Type':'application/json'},
              method='POST'
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              external = json.loads(resp.read().decode())
          assert external.get('json') == anchor_payload
          anchor = {'source':'https://httpbin.org/post','transport':'HTTPS_EXTERNAL','observed':external['json']}
          anchor['anchor_hash'] = sha(anchor['observed'])

          def quorum(rs):
              if len({r['execution_id'] for r in rs}) != 3:
                  return 'REJECT','REPLAY_DETECTED'
              if not all(integrity(r) for r in rs):
                  return 'REJECT','TAMPER_DETECTED'
              positives = sum(r['decision']=='ACCEPT' and r['capability']=='EXECUTED' for r in rs)
              return ('ACCEPT','QUORUM_2_OF_3') if positives >= 2 else ('REJECT','NO_QUORUM')

          baseline = quorum([a,b,c]); assert baseline == ('ACCEPT','QUORUM_2_OF_3')
          provider_loss = ('ACCEPT','SURVIVES_C_LOSS') if all(integrity(r) for r in [a,b]) else ('REJECT','PROVIDER_LOSS')
          assert provider_loss == ('ACCEPT','SURVIVES_C_LOSS')
          collusion = quorum([ca,cb,c]); assert collusion == ('ACCEPT','QUORUM_2_OF_3')

          colluder_claim = ca['observed']['payload']['message']
          external_truth = anchor['observed']['message']
          anchor_gate = ('REJECT','REALITY_ANCHOR_MISMATCH') if colluder_claim != external_truth else ('ACCEPT','ANCHOR_MATCH')
          assert anchor_gate == ('REJECT','REALITY_ANCHOR_MISMATCH')

          tampered = copy.deepcopy(a)
          tampered['observed']['payload']['message'] = 'TAMPERED'
          tamper = 'REJECT' if not integrity(tampered) else 'ACCEPT'
          assert tamper == 'REJECT'

          replayed = [copy.deepcopy(a), copy.deepcopy(b), copy.deepcopy(c)]
          replayed[2]['execution_id'] = replayed[0]['execution_id']
          replay = quorum(replayed)[0]
          assert replay == 'REJECT'

          final_honest = 'ACCEPT' if baseline[0]=='ACCEPT' and external_truth == expected['payload']['message'] else 'REJECT'
          final_collusion = 'REJECT' if collusion[0]=='ACCEPT' and anchor_gate[0]=='REJECT' else 'ACCEPT'
          assert final_honest == 'ACCEPT'
          assert final_collusion == 'REJECT'

          result = {
              'rsta':'RSTA-022.1',
              'status':'PASS',
              'baseline_quorum': {'decision':baseline[0], 'reason':baseline[1]},
              'provider_failure': {'decision':provider_loss[0], 'reason':provider_loss[1], 'simulation':'C removed; A+B independently verified'},
              'collusion_simulation': {'quorum':collusion[0], 'anchor_gate':anchor_gate[0], 'final':final_collusion},
              'tamper':tamper,
              'replay':replay,
              'final_capability_gate': {'honest':final_honest, 'colluding_majority':final_collusion},
              'anchor_source':anchor['source'],
              'anchor_transport':anchor['transport'],
              'anchor_hash':anchor['anchor_hash'],
              'claim_boundary':'HTTP echo proves external transport/observation only; it is not a strong independent world-truth oracle.'
          }
          Path('rsta0221-final-verdict.json').write_text(json.dumps(result, indent=2, ensure_ascii=False))
          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

      - name: Persist RSTA-022.1 verdict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rsta0221-final-verdict.json
          git commit -m 'rsta: persist RSTA-022.1 verdict [skip ci]'
          git push origin HEAD:main
