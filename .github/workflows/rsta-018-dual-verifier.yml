name: RSTA-018 Dual Independent Verifiers

on:
  push:
    branches: [main]
    paths:
      - 'rsta/rsta016-live-evidence.json'
      - 'rsta/rsta018-executor2-live-receipt.json'
      - '.github/workflows/rsta-018-dual-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

# Final RSTA-018 audit run: durable shared state is the only input.

jobs:
  python-verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence
        uses: actions/checkout@v4
      - name: Verify both receipts and conflict rejection in Python
        run: |
          python3 - <<'PY'
          import hashlib, json
          def canonical(v):
              if v is None or not isinstance(v, (dict, list)):
                  return json.dumps(v, separators=(',', ':'), ensure_ascii=False)
              if isinstance(v, list): return '[' + ','.join(canonical(x) for x in v) + ']'
              return '{' + ','.join(json.dumps(k, ensure_ascii=False, separators=(',', ':')) + ':' + canonical(v[k]) for k in sorted(v)) + '}'
          def sha(v): return hashlib.sha256(canonical(v).encode()).hexdigest()
          a = json.load(open('rsta/rsta016-live-evidence.json', encoding='utf-8'))['remote_receipt']
          b = json.load(open('rsta/rsta018-executor2-live-receipt.json', encoding='utf-8'))['receipt']
          def projection(r): return {'protocol_version':r['protocol_version'],'commitment_id':r['commitment_id'],'action':r.get('action',r['observed']['action']),'payload':r.get('payload',r['observed']['payload']),'commitment_hash':r['commitment_hash'],'observed':r['observed']}
          for r in (a,b):
              assert r['decision'] == 'ACCEPT' and r['capability'] == 'EXECUTED'
              p=projection(r); assert sha({k:p[k] for k in ['protocol_version','commitment_id','action','payload']}) == r['commitment_hash']
              core={k:r[k] for k in ['protocol_version','commitment_id','commitment_hash','execution_id','executor_id','implementation','executor_repository','executor_revision','transport','observed']}
              assert sha(core) == r['receipt_hash']
          assert projection(a) == projection(b)
          assert a['executor_id'] != b['executor_id']
          conflict=json.loads(json.dumps(projection(b))); conflict['observed']['payload']['message']='CONFLICT-INJECTED'
          assert projection(a) != conflict
          print('RSTA-018-PYTHON=PASS')
          print('receipt_A_integrity=true'); print('receipt_B_integrity=true'); print('same_commitment=true'); print('same_observation=true'); print('distinct_executors=true'); print('conflict_detection=true'); print('conflict_result=REJECT')
          print('commitment_hash='+a['commitment_hash']); print('receipt_A_hash='+a['receipt_hash']); print('receipt_B_hash='+b['receipt_hash'])
          PY

  node-verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence
        uses: actions/checkout@v4
      - name: Verify both receipts and conflict rejection in Node
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const canonical=v=>{if(v===null||typeof v!=='object')return JSON.stringify(v);if(Array.isArray(v))return `[${v.map(canonical).join(',')}]`;return `{${Object.keys(v).sort().map(k=>`${JSON.stringify(k)}:${canonical(v[k])}`).join(',')}}`;};
          const sha=v=>crypto.createHash('sha256').update(canonical(v),'utf8').digest('hex');
          const a=JSON.parse(fs.readFileSync('rsta/rsta016-live-evidence.json','utf8')).remote_receipt;
          const b=JSON.parse(fs.readFileSync('rsta/rsta018-executor2-live-receipt.json','utf8')).receipt;
          const p=r=>({protocol_version:r.protocol_version,commitment_id:r.commitment_id,action:r.action??r.observed.action,payload:r.payload??r.observed.payload,commitment_hash:r.commitment_hash,observed:r.observed});
          for(const r of [a,b]){const q=p(r);if(r.decision!=='ACCEPT'||r.capability!=='EXECUTED')throw Error('execution status invalid');if(sha({protocol_version:q.protocol_version,commitment_id:q.commitment_id,action:q.action,payload:q.payload})!==r.commitment_hash)throw Error('commitment hash mismatch');const core={protocol_version:r.protocol_version,commitment_id:r.commitment_id,commitment_hash:r.commitment_hash,execution_id:r.execution_id,executor_id:r.executor_id,implementation:r.implementation,executor_repository:r.executor_repository,executor_revision:r.executor_revision,transport:r.transport,observed:r.observed};if(sha(core)!==r.receipt_hash)throw Error('receipt hash mismatch');}
          if(JSON.stringify(p(a))!==JSON.stringify(p(b)))throw Error('cross-executor conflict'); if(a.executor_id===b.executor_id)throw Error('executors are not distinct'); const conflict=JSON.parse(JSON.stringify(p(b)));conflict.observed.payload.message='CONFLICT-INJECTED';if(JSON.stringify(p(a))===JSON.stringify(conflict))throw Error('conflict injection not detected');
          console.log('RSTA-018-NODE=PASS'); console.log('receipt_A_integrity=true'); console.log('receipt_B_integrity=true'); console.log('same_commitment=true'); console.log('same_observation=true'); console.log('distinct_executors=true'); console.log('conflict_detection=true'); console.log('conflict_result=REJECT'); console.log('commitment_hash='+a.commitment_hash); console.log('receipt_A_hash='+a.receipt_hash); console.log('receipt_B_hash='+b.receipt_hash);
          NODE
