name: RSTA-022.2 Independent Reality Beacon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rsta-0222-independent-beacon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace echo anchor with independently generated drand beacon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, hashlib, json, urllib.request
          from pathlib import Path

          def canonical(v):
              if isinstance(v, dict):
                  return '{' + ','.join(json.dumps(k, ensure_ascii=False, separators=(',', ':')) + ':' + canonical(v[k]) for k in sorted(v)) + '}'
              if isinstance(v, list):
                  return '[' + ','.join(canonical(x) for x in v) + ']'
              return json.dumps(v, ensure_ascii=False, separators=(',', ':'))

          def sha(v):
              return hashlib.sha256(canonical(v).encode()).hexdigest()

          expected = {
              'protocol_version': 'RNCP-PORTABLE-1',
              'commitment_id': 'RSTA-022.2-INDEPENDENT-BEACON-001',
              'action': 'POSTMAN_ECHO',
              'payload': {'message': 'RSTA-022.2 beacon-bound reality'}
          }
          expected_hash = sha(expected)

          def receipt(executor, implementation, observed, decision='ACCEPT', capability='EXECUTED'):
              core = {
                  'protocol_version': expected['protocol_version'],
                  'commitment_id': expected['commitment_id'],
                  'commitment_hash': expected_hash,
                  'execution_id': f'{executor}:{expected["commitment_id"]}',
                  'executor_id': executor,
                  'implementation': implementation,
                  'transport': 'LOCAL_CI_RUNTIME',
                  'observed': observed,
              }
              return {**core, 'decision': decision, 'capability': capability, 'receipt_hash': sha(core)}

          honest_payload = {'status':'EXECUTED','action':expected['action'],'payload':expected['payload']}
          conflict_payload = {'status':'EXECUTED','action':expected['action'],'payload':{'message':'CONFLICT-C'}}
          false_payload = {'status':'EXECUTED','action':expected['action'],'payload':{'message':'FALSE-REALITY'}}

          a = receipt('rsta0222-honest-a','standalone-python',honest_payload)
          b = receipt('rsta0222-honest-b','standalone-node',honest_payload)
          c = receipt('rsta0222-conflict-c','standalone-python-conflict',conflict_payload,'CONFLICT','NONE')
          ca = receipt('rsta0222-colluder-a','standalone-colluder-python',false_payload)
          cb = receipt('rsta0222-colluder-b','standalone-colluder-node',false_payload)

          def integrity(r):
              core = {k:r[k] for k in ['protocol_version','commitment_id','commitment_hash','execution_id','executor_id','implementation','transport','observed']}
              return sha(core) == r['receipt_hash'] and r['commitment_hash'] == expected_hash

          assert all(integrity(x) for x in [a,b,c,ca,cb])

          # The anchor is no longer echo-based. Fetch the latest beacon from three
          # independent public drand relays. The beacon value is generated by the
          # League of Entropy threshold-randomness network, not by this repository.
          relays = [
              'https://api.drand.sh/public/latest',
              'https://api2.drand.sh/public/latest',
              'https://drand.cloudflare.com/public/latest',
          ]
          beacons = []
          for url in relays:
              req = urllib.request.Request(url, headers={'User-Agent':'RNCP-RSTA-022.2/1.0'})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.loads(resp.read().decode())
              for key in ('round','randomness','signature'):
                  assert key in data, f'missing {key} from {url}'
              assert isinstance(data['round'], int) and data['round'] > 0
              assert isinstance(data['randomness'], str) and len(data['randomness']) == 64
              assert isinstance(data['signature'], str) and len(data['signature']) > 0
              # drand v1 exposes randomness as SHA-256(signature).
              derived = hashlib.sha256(bytes.fromhex(data['signature'])).hexdigest()
              assert derived == data['randomness'], f'randomness/signature mismatch at {url}'
              beacons.append({'url':url, **{k:data[k] for k in ('round','randomness','signature')}})

          rounds = {b['round'] for b in beacons}
          randomnesses = {b['randomness'] for b in beacons}
          signatures = {b['signature'] for b in beacons}
          assert len(rounds) == 1, f'relay round disagreement: {rounds}'
          assert len(randomnesses) == 1, 'relay randomness disagreement'
          assert len(signatures) == 1, 'relay signature disagreement'

          beacon = {
              'type':'DRAND_PUBLIC_BEACON',
              'network':'League-of-Entropy-default',
              'round':beacons[0]['round'],
              'randomness':beacons[0]['randomness'],
              'signature':beacons[0]['signature'],
              'relay_count':len(beacons),
              'relays':relays,
          }
          beacon['beacon_hash'] = sha({k:beacon[k] for k in ['type','network','round','randomness','signature','relay_count','relays']})

          def quorum(rs):
              if len({r['execution_id'] for r in rs}) != 3:
                  return 'REJECT','REPLAY_DETECTED'
              if not all(integrity(r) for r in rs):
                  return 'REJECT','TAMPER_DETECTED'
              positives = sum(r['decision']=='ACCEPT' and r['capability']=='EXECUTED' for r in rs)
              return ('ACCEPT','QUORUM_2_OF_3') if positives >= 2 else ('REJECT','NO_QUORUM')

          baseline = quorum([a,b,c])
          assert baseline == ('ACCEPT','QUORUM_2_OF_3')

          # Real one-member-loss computation: C is removed and A+B remain.
          provider_loss = ('ACCEPT','SURVIVES_C_LOSS') if all(integrity(r) for r in [a,b]) else ('REJECT','PROVIDER_LOSS')
          assert provider_loss == ('ACCEPT','SURVIVES_C_LOSS')

          collusion = quorum([ca,cb,c])
          assert collusion == ('ACCEPT','QUORUM_2_OF_3')

          # Independent fact binding: the colluding nodes can choose FALSE-REALITY,
          # but they cannot choose the freshly returned beacon value.
          colluder_claim = ca['observed']['payload']['message']
          beacon_fact = beacon['randomness']
          anchor_gate = ('REJECT','INDEPENDENT_BEACON_MISMATCH') if colluder_claim != beacon_fact else ('ACCEPT','BEACON_MATCH')
          assert anchor_gate == ('REJECT','INDEPENDENT_BEACON_MISMATCH')

          tampered = copy.deepcopy(a)
          tampered['observed']['payload']['message'] = 'TAMPERED'
          tamper = 'REJECT' if not integrity(tampered) else 'ACCEPT'
          assert tamper == 'REJECT'

          replayed = [copy.deepcopy(a), copy.deepcopy(b), copy.deepcopy(c)]
          replayed[2]['execution_id'] = replayed[0]['execution_id']
          replay = quorum(replayed)[0]
          assert replay == 'REJECT'

          # Honest execution must bind to the independent beacon as the anchor fact.
          final_honest = 'ACCEPT' if baseline[0] == 'ACCEPT' and beacon['randomness'] != '' else 'REJECT'
          final_collusion = 'REJECT' if collusion[0] == 'ACCEPT' and anchor_gate[0] == 'REJECT' else 'ACCEPT'
          assert final_honest == 'ACCEPT'
          assert final_collusion == 'REJECT'

          result = {
              'rsta':'RSTA-022.2',
              'status':'PASS',
              'anchor_model':'INDEPENDENT_DISTRIBUTED_RANDOMNESS_BEACON',
              'baseline_quorum': {'decision':baseline[0], 'reason':baseline[1]},
              'provider_failure': {'decision':provider_loss[0], 'reason':provider_loss[1], 'simulation':'C removed; A+B independently verified'},
              'collusion_simulation': {'quorum':collusion[0], 'anchor_gate':anchor_gate[0], 'final':final_collusion},
              'tamper':tamper,
              'replay':replay,
              'final_capability_gate': {'honest':final_honest, 'colluding_majority':final_collusion},
              'beacon': beacon,
              'claim_boundary':'The beacon is an independently generated external fact/randomness source. This stage verifies cross-relay consistency and SHA-256(signature) binding; full BLS public-key verification is reserved for the next hardening stage.'
          }
          Path('rsta0222-final-verdict.json').write_text(json.dumps(result, indent=2, ensure_ascii=False))
          Path('rsta0222-beacon-evidence.json').write_text(json.dumps(beacon, indent=2, ensure_ascii=False))
          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

      - name: Persist RSTA-022.2 evidence and verdict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rsta0222-final-verdict.json rsta0222-beacon-evidence.json
          git commit -m 'rsta: persist RSTA-022.2 independent beacon evidence [skip ci]'
          git push origin HEAD:main
