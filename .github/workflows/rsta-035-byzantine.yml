name: RSTA-035 Byzantine Multi-Executor + Independent Fact Verifier

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  executor-a:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Execute as A
        env:
          GH_TOKEN: ${{ github.token }}
          RSTA035_ROLE: A
        run: node rsta/rsta035-byzantine.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rsta035-A
          path: rsta035-A.json

  executor-b:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Execute as B
        env:
          GH_TOKEN: ${{ github.token }}
          RSTA035_ROLE: B
        run: node rsta/rsta035-byzantine.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rsta035-B
          path: rsta035-B.json

  executor-c:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Execute as Byzantine C
        env:
          GH_TOKEN: ${{ github.token }}
          RSTA035_ROLE: C
        run: node rsta/rsta035-byzantine.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rsta035-C
          path: rsta035-C.json

  independent-verifier:
    needs: [executor-a, executor-b, executor-c]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rsta035-A
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: rsta035-B
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: rsta035-C
          path: .
      - name: Verify all reports independently
        env:
          GH_TOKEN: ${{ github.token }}
          RSTA035_ROLE: verify
        run: node rsta/rsta035-byzantine.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rsta035-verifier-evidence
          path: |
            rsta035-execution-receipt.json
            rsta035-final-verdict.json

  evidence-writer:
    needs: independent-verifier
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rsta035-verifier-evidence
          path: evidence
      - name: Persist evidence through unique Contents API objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for file in rsta035-execution-receipt.json rsta035-final-verdict.json; do
            body_b64=$(base64 -w 0 "evidence/$file")
            path="rsta-evidence/rsta035/${GITHUB_RUN_ID}-${file}"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" -X PUT \
              -f message="rsta: persist RSTA-035 ${file} run ${GITHUB_RUN_ID} [skip ci]" \
              -f content="$body_b64"
          done
          echo "RSTA-035 evidence persisted: ${GITHUB_RUN_ID}"
