name: RSTA-023 BLS Cryptographic Verification and Anti-Equivocation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rsta-023-bls-chain.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@v4

      - name: Install isolated verification dependencies
        run: |
          set -euxo pipefail
          rm -rf .rsta023
          mkdir .rsta023
          cd .rsta023
          npm init -y
          npm config set registry https://registry.npmjs.org/
          npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000 @noble/curves@2.3.0 @noble/hashes@2.4.0

      - name: Fetch 3 relays and verify 3-round BLS chain
        run: |
          set -euo pipefail
          cd .rsta023
          node > ../rsta023-final-verdict.json <<'JS'
          import crypto from 'node:crypto';
          import {bls12_381 as bls} from '@noble/curves/bls12-381.js';
          import {sha256} from '@noble/hashes/sha2.js';

          const CHAIN='8990e7a9aaed2ffed73dbd7092123d6f289930540d7651336225dc172e51b2ce';
          const PINNED_PUBKEY='868f005eb8e6e4ca0a47c8a77ceaa5309a47978a7c71bc5cce96366b5d7a569937c529eeda66c7293784a9402801af31';
          const RELAYS=['https://api.drand.sh','https://api2.drand.sh','https://api3.drand.sh'];
          const PERIOD=30;
          const GENESIS=1595431050;
          const SCHEME='pedersen-bls-chained';

          const h=b=>Buffer.from(sha256(b));
          const be64=n=>{const b=Buffer.alloc(8);b.writeBigUInt64BE(BigInt(n));return b;};
          const canonical=v=>v&&typeof v==='object'?(Array.isArray(v)?'['+v.map(canonical).join(',')+']':'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canonical(v[k])).join(',')+'}'):JSON.stringify(v);
          const shaHex=v=>crypto.createHash('sha256').update(canonical(v)).digest('hex');

          function currentRound(now=Math.floor(Date.now()/1000)){return now<GENESIS?0:Math.floor((now-GENESIS)/PERIOD)+1;}
          async function getJson(url){const r=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'});if(!r.ok)throw new Error(`${url} HTTP ${r.status}`);return await r.json();}
          async function getBeacon(relay,round='latest'){
            const urls=round==='latest'?[`${relay}/${CHAIN}/public/latest`,`${relay}/public/latest`]:[`${relay}/${CHAIN}/public/${round}`,`${relay}/public/${round}`];
            let last;for(const u of urls){try{return {...await getJson(u),_url:u};}catch(e){last=e;}}throw last;
          }
          function verifyRandomness(b){return Buffer.from(b.randomness,'hex').equals(h(Buffer.from(b.signature,'hex')));}
          function verifyBlsChained(b){
            const message=h(Buffer.concat([Buffer.from(b.previous_signature,'hex'),be64(b.round)]));
            return bls.longSignatures.verify(b.signature,message,PINNED_PUBKEY);
          }

          const samples=await Promise.all(RELAYS.map(async relay=>({relay,latest:await getBeacon(relay)})));
          const observedLatestRounds=samples.map(x=>Number(x.latest.round));
          const targetRound=Math.min(...observedLatestRounds);
          const expected=currentRound();
          if(!(targetRound===expected||targetRound===expected-1))throw new Error(`target round outside live window: target=${targetRound} expected=${expected}`);

          const relayData=[];
          for(const s of samples){
            const info=await getJson(`${s.relay}/${CHAIN}/info`);
            if(info.hash!==CHAIN)throw new Error(`chain hash mismatch at ${s.relay}: ${info.hash}`);
            if(info.period!==PERIOD||info.genesis_time!==GENESIS)throw new Error(`chain timing mismatch at ${s.relay}`);
            if(info.schemeID&&info.schemeID!==SCHEME)throw new Error(`scheme mismatch at ${s.relay}: ${info.schemeID}`);
            if(info.public_key&&info.public_key.toLowerCase()!==PINNED_PUBKEY)throw new Error(`public key mismatch at ${s.relay}`);
            const beacons=[];
            for(const round of [targetRound-2,targetRound-1,targetRound])beacons.push(await getBeacon(s.relay,round));
            relayData.push({relay:s.relay,info,beacons});
          }

          const crossRoundChecks=[];
          for(let i=0;i<3;i++){
            const rs=relayData.map(x=>Number(x.beacons[i].round));
            const sigs=relayData.map(x=>x.beacons[i].signature);
            const prevs=relayData.map(x=>x.beacons[i].previous_signature);
            const check={round:targetRound-2+i,rounds_equal:new Set(rs).size===1&&rs[0]===targetRound-2+i,signatures_equal:new Set(sigs).size===1,previous_signatures_equal:new Set(prevs).size===1};
            crossRoundChecks.push(check);
            if(!(check.rounds_equal&&check.signatures_equal&&check.previous_signatures_equal))throw new Error(`cross-relay equivocation detected: ${JSON.stringify(crossRoundChecks)}`);
          }

          const cryptographicChecks=[];
          for(const b of relayData[0].beacons){
            const randomnessOk=verifyRandomness(b);
            const blsOk=verifyBlsChained(b);
            cryptographicChecks.push({round:Number(b.round),randomness_binding:randomnessOk,bls_signature:blsOk});
            if(!(randomnessOk&&blsOk))throw new Error(`crypto verification failed at round ${b.round}: randomness=${randomnessOk} bls=${blsOk}`);
          }

          const chainContinuity=[];
          for(let i=1;i<3;i++){
            const prev=relayData[0].beacons[i-1],cur=relayData[0].beacons[i];
            const ok=Number(cur.round)===Number(prev.round)+1&&cur.previous_signature===prev.signature;
            chainContinuity.push({from:Number(prev.round),to:Number(cur.round),linked:ok});
            if(!ok)throw new Error(`chain continuity failed ${prev.round}->${cur.round}`);
          }

          const good=relayData[0].beacons[2];
          const safeBool=fn=>{try{return !!fn();}catch{return false;}};
          const tamperedSignature={...good,signature:'00'.repeat(96)};
          const alteredPrevious={...good,previous_signature:'00'.repeat(96)};
          const alteredRound={...good,round:Number(good.round)+1};
          const tamperRejected=!safeBool(()=>verifyBlsChained(tamperedSignature));
          const previousRejected=!safeBool(()=>verifyBlsChained(alteredPrevious));
          const roundRejected=!safeBool(()=>verifyBlsChained(alteredRound));
          if(!(tamperRejected&&previousRejected&&roundRejected))throw new Error('negative cryptographic controls failed');

          const verdict={
            rsta:'RSTA-023',status:'PASS',
            chain:{hash:CHAIN,scheme:SCHEME,period:PERIOD,genesis_time:GENESIS,pinned_public_key:PINNED_PUBKEY},
            observed_latest_rounds:observedLatestRounds,target_round:targetRound,current_round_expected:expected,verified_round_window:[targetRound-2,targetRound-1,targetRound],
            bls_signature_verification:{all_three_rounds:true,checks:cryptographicChecks},
            randomness_hash_binding:{all_three_rounds:true},
            round_continuity:{window:true,links:chainContinuity},
            cross_relay_anti_equivocation:{relay_count:RELAYS.length,rounds:crossRoundChecks},
            negative_controls:{tampered_signature_rejected:tamperRejected,previous_signature_rejected:previousRejected,round_mutation_rejected:roundRejected},
            relay_snapshot:relayData.map(x=>({relay:x.relay,rounds:x.beacons.map(b=>Number(b.round)),signatures:x.beacons.map(b=>b.signature),previous_signatures:x.beacons.map(b=>b.previous_signature)})),
            evidence_hash:shaHex({chain:CHAIN,window:[targetRound-2,targetRound-1,targetRound],relays:relayData.map(x=>({relay:x.relay,beacons:x.beacons}))})
          };
          console.log(JSON.stringify(verdict,null,2));
          JS

      - name: Persist RSTA-023 verdict
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rsta023-final-verdict.json
          git commit -m 'rsta: persist RSTA-023 cryptographic verification verdict [skip ci]'
          git push origin HEAD:main
