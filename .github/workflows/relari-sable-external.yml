name: SABLE External Live Probe

on:
  push:
    branches:
      - main
    paths:
      - 'relari-sable-probe/**'
      - '.github/workflows/relari-sable-external.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout probe repository
        uses: actions/checkout@v4

      - name: Checkout SABLE verifier
        uses: actions/checkout@v4
        with:
          repository: socksninja/sable-agent-reliability
          path: .sable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Run external FMP tool agent and capture SABLE submission
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python relari-sable-probe/run_relari_one_task.py

      - name: Validate SABLE submission
        run: |
          test -s artifacts/submission-v09.jsonl
          python .sable/trace_submit_v09.py \
            --input artifacts/submission-v09.jsonl \
            --output artifacts/sable-trace-v05.jsonl

      - name: Build evidence manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('artifacts')
          files = []
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  files.append({
                      'path': str(p.relative_to(root)),
                      'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
                      'size': p.stat().st_size,
                  })
          (root / 'sable-evidence-manifest.json').write_text(
              json.dumps({'schema_version': 'sable.evidence_manifest.v0.1', 'files': files}, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload SABLE evidence
        uses: actions/upload-artifact@v4
        with:
          name: sable-external-evidence-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error

# Explicit push-trigger marker for the live external probe.
