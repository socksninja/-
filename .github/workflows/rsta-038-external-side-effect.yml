name: RSTA-038 Cross-Provider Real Side Effect

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  cross-provider-side-effect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout SABLE verifier
        uses: actions/checkout@v4
        with:
          repository: socksninja/sable-agent-reliability
          path: .sable
          fetch-depth: 1

      - name: Generate fixed portable commitment
        run: |
          node > rsta038-commitment.json <<'JS'
          const c = {
            protocol_version: 'RNCP-PORTABLE-1',
            commitment_id: `RSTA-038-${process.env.GITHUB_RUN_ID}`,
            action: 'RSTA038_PERSIST_EXTERNAL_FACT',
            payload: { run_id: Number(process.env.GITHUB_RUN_ID), nonce: `rsta038-${process.env.GITHUB_RUN_ID}` }
          };
          console.log(JSON.stringify(c, null, 2));
          JS

      - name: GitHub provider real side effect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(node -e "console.log(JSON.parse(require('fs').readFileSync('rsta038-commitment.json')).commitment_id)")
          body="RNCP RSTA-038 real side effect\ncommitment_id=${id}\nprovider=github-actions"
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="RSTA-038 REALITY ${id}" -f body="$body" > github-action.json
          cat github-action.json

      - name: Execute real Relari agent and capture SABLE submission
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          set -euo pipefail
          python -m pip install poetry
          python relari-sable-probe/run_relari_one_task.py

      - name: Validate and normalize Relari SABLE submission
        run: |
          set -euo pipefail
          test -s artifacts/submission-v09.jsonl
          test -f .sable/trace_submit_v09.py
          python .sable/trace_submit_v09.py \
            --input artifacts/submission-v09.jsonl \
            --output artifacts/sable-trace-v05.jsonl

      - name: Build SABLE evidence manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('artifacts')
          files = []
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  files.append({
                      'path': str(p.relative_to(root)),
                      'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
                      'size': p.stat().st_size,
                  })
          (root / 'sable-evidence-manifest.json').write_text(
              json.dumps({'schema_version':'sable.evidence_manifest.v0.1','files':files}, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload Relari SABLE external evidence
        uses: actions/upload-artifact@v7
        with:
          name: sable-relari-external-evidence-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error

      - name: Vercel provider external side effect diagnostics
        env:
          VERCEL_EXECUTOR_URL: https://ten-psi-68.vercel.app/api/rsta038/executor
        continue-on-error: true
        run: |
          set +e
          node --input-type=module <<'JS' > vercel-executor.json
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('rsta038-commitment.json','utf8'));
          const response=await fetch(process.env.VERCEL_EXECUTOR_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(c)});
          const text=await response.text();
          fs.writeFileSync('vercel-http-status.txt', String(response.status));
          console.log(text);
          process.exit(response.ok ? 0 : 2);
          JS
          status=$?
          echo "vercel_status=$(cat vercel-http-status.txt 2>/dev/null || echo unknown)"
          echo '--- vercel response body ---'
          cat vercel-executor.json 2>/dev/null || true
          exit "$status"

      - name: Stop here: old Vercel deployment is diagnostic only
        run: |
          echo 'RSTA-038 diagnostic run: production Vercel is intentionally not counted as PASS until v3-aisense is deployed.'
          exit 0
