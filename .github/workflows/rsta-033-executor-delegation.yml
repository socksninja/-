name: RSTA-033 Executor Delegation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  subject:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build subject commitment and delegation
        run: node rsta/rsta033-live.mjs subject
      - uses: actions/upload-artifact@v4
        with:
          name: rsta033-subject
          path: rsta033-subject.json

  executor:
    needs: subject
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rsta033-subject
          path: subject
      - name: Verify delegation and execute real external action
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: node rsta/rsta033-live.mjs executor
      - name: Recompute persisted receipt content address
        run: |
          set -euo pipefail
          node <<'JS'
          import fs from 'node:fs'; import crypto from 'node:crypto';
          const canonical=(v)=>v&&typeof v==='object'?(Array.isArray(v)?'['+v.map(canonical).join(',')+']':'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canonical(v[k])).join(',')+'}'):JSON.stringify(v);
          const hash=(v)=>crypto.createHash('sha256').update(canonical(v)).digest('hex');
          const r=JSON.parse(fs.readFileSync('rsta033-execution-receipt.json','utf8')); const stored=r.content_address; const c=structuredClone(r); delete c.content_address;
          if(hash(c)!==stored) throw new Error('RSTA-033 content address mismatch');
          for(const [k,v] of Object.entries(r.assertions)) if(v!==true) throw new Error(`assertion failed: ${k}`);
          console.log(JSON.stringify({receipt_verified:true,content_address:stored},null,2));
          JS
      - name: Persist RSTA-033 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rsta033-final-verdict.json rsta033-execution-receipt.json rsta033-delegated-reality-receipt.json
          git commit -m 'rsta: persist RSTA-033 delegation receipt [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0 || { git rebase --abort || true; sleep 1; }
          done
          exit 1
