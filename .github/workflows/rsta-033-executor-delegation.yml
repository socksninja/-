name: RSTA-033 Executor Delegation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  subject:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build subject commitment and delegation
        run: node rsta/rsta033-live.mjs subject
      - uses: actions/upload-artifact@v4
        with:
          name: rsta033-subject
          path: rsta033-subject.json

  executor:
    needs: subject
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rsta033-subject
          path: subject
      - name: Verify delegation and execute real external action
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: node rsta/rsta033-live.mjs executor
      - name: Recompute persisted receipt content address
        run: |
          set -euo pipefail
          node <<'JS'
          import fs from 'node:fs'; import crypto from 'node:crypto';
          const canonical=(v)=>v&&typeof v==='object'?(Array.isArray(v)?'['+v.map(canonical).join(',')+']':'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canonical(v[k])).join(',')+'}'):JSON.stringify(v);
          const hash=(v)=>crypto.createHash('sha256').update(canonical(v)).digest('hex');
          const r=JSON.parse(fs.readFileSync('rsta033-execution-receipt.json','utf8')); const stored=r.content_address; const c=structuredClone(r); delete c.content_address;
          if(hash(c)!==stored) throw new Error('RSTA-033 content address mismatch');
          for(const [k,v] of Object.entries(r.assertions)) if(v!==true) throw new Error(`assertion failed: ${k}`);
          console.log(JSON.stringify({receipt_verified:true,content_address:stored},null,2));
          JS
      - name: Persist RSTA-033 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rsta033-final-verdict.json rsta033-execution-receipt.json rsta033-delegated-reality-receipt.json
          git commit -m 'rsta: persist RSTA-033 delegation receipt [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0 || { git rebase --abort || true; sleep 1; }
          done
          exit 1

  rsta035-executor-a:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Execute A
        env:
          GH_TOKEN: ${{ github.token }}
          RSTA035_ROLE: A
        run: node rsta/rsta035-byzantine.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rsta035-A
          path: rsta035-A.json

  rsta035-executor-b:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Execute B
        env:
          GH_TOKEN: ${{ github.token }}
          RSTA035_ROLE: B
        run: node rsta/rsta035-byzantine.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rsta035-B
          path: rsta035-B.json

  rsta035-executor-c:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Execute Byzantine C
        env:
          GH_TOKEN: ${{ github.token }}
          RSTA035_ROLE: C
        run: node rsta/rsta035-byzantine.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rsta035-C
          path: rsta035-C.json

  rsta035-independent-verifier:
    needs: [rsta035-executor-a, rsta035-executor-b, rsta035-executor-c]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rsta035-A
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: rsta035-B
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: rsta035-C
          path: .
      - name: Verify independently against GitHub reality + drand
        env:
          GH_TOKEN: ${{ github.token }}
          RSTA035_ROLE: verify
        run: node rsta/rsta035-byzantine.mjs
      - name: Persist RSTA-035 evidence via unique Contents API objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for file in rsta035-execution-receipt.json rsta035-final-verdict.json; do
            body_b64=$(base64 -w 0 "$file")
            path="rsta-evidence/rsta035/${GITHUB_RUN_ID}-${file}"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" -X PUT \
              -f message="rsta: persist RSTA-035 ${file} run ${GITHUB_RUN_ID} [skip ci]" \
              -f content="$body_b64"
          done
          echo "Evidence persisted for run ${GITHUB_RUN_ID}"
