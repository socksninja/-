name: RSTA-038 External Sink Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  sink-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Real public storage create and independent read
        run: |
          set -euo pipefail
          payload=$(node -e 'console.log(JSON.stringify({rncp_protocol:"RNCP-PORTABLE-1",rsta:"RSTA-038-SINK-SMOKE",nonce:process.env.GITHUB_RUN_ID}))')
          response=$(curl -fsS --max-time 20 -X POST 'https://aisenseapi.com/services/v1/storage' -H 'Content-Type: application/json' -d "$payload")
          echo "$response"
          storage_id=$(node -e 'const r=JSON.parse(process.argv[1]); if(!r.storage_id) process.exit(1); console.log(r.storage_id)' "$response")
          locator="https://aisenseapi.com/services/v1/storage/${storage_id}"
          readback=$(curl -fsS --max-time 20 "$locator")
          echo "$readback"
          node -e 'const got=JSON.parse(process.argv[1]); const expected=JSON.parse(process.argv[2]); if(JSON.stringify(got)!==JSON.stringify(expected)) { console.error({expected,got}); process.exit(1) }' "$readback" "$payload"
          echo "SINK_SMOKE_PASS storage_id=$storage_id locator=$locator"
