name: RSTA-037 Cross-Provider Live Execution

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cross-provider:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate shared portable commitment
        run: |
          node > rsta037-commitment.json <<'JS'
          const c = {
            protocol_version: 'RNCP-PORTABLE-1',
            commitment_id: `RSTA-037-${process.env.GITHUB_RUN_ID}`,
            action: 'RSTA037_CROSS_PROVIDER_PROBE',
            payload: { run_id: Number(process.env.GITHUB_RUN_ID), nonce: `rsta037-${process.env.GITHUB_RUN_ID}` }
          };
          console.log(JSON.stringify(c, null, 2));
          JS

      - name: Execute real GitHub external action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commitment_id=$(node -e "console.log(JSON.parse(require('fs').readFileSync('rsta037-commitment.json')).commitment_id)")
          body="RNCP RSTA-037 real external action\ncommitment_id=${commitment_id}\nprovider=github-actions"
          issue_json=$(gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="RSTA-037 REALITY ${commitment_id}" -f body="$body")
          printf '%s\n' "$issue_json" > github-action.json

      - name: Execute live Vercel executor and verify both with same portable verifier
        env:
          VERCEL_EXECUTOR_URL: https://ten-psi-68.vercel.app/api/rsta016/executor
        run: |
          set -euo pipefail
          commitment_id=$(node -e "console.log(JSON.parse(require('fs').readFileSync('rsta037-commitment.json')).commitment_id)")
          payload=$(node -e "console.log(JSON.stringify(JSON.parse(require('fs').readFileSync('rsta037-commitment.json')).payload))")
          curl -fsS --max-time 20 -G "$VERCEL_EXECUTOR_URL" \
            --data-urlencode "commitment_id=${commitment_id}" \
            --data-urlencode "action=RSTA037_CROSS_PROVIDER_PROBE" \
            --data-urlencode "payload=${payload}" > vercel-executor.json
          node -e "const r=require('./vercel-executor.json'); if(r.decision!=='ACCEPT'||r.capability!=='EXECUTED') process.exit(1)"
          cat vercel-executor.json

      - name: Build and verify provider-neutral receipts
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { verifyPortableReceipt, assertNoReplay, sha256 } from './rsta/rsta037-portable-verifier.mjs';
          const commitment=JSON.parse(fs.readFileSync('rsta037-commitment.json','utf8'));
          const issue=JSON.parse(fs.readFileSync('github-action.json','utf8'));
          const vercel=JSON.parse(fs.readFileSync('vercel-executor.json','utf8'));
          const commitment_hash=sha256({protocol_version:commitment.protocol_version,commitment_id:commitment.commitment_id,action:commitment.action,payload:commitment.payload});
          const githubCore={protocol_version:commitment.protocol_version,commitment_id:commitment.commitment_id,commitment_hash,execution_id:`github-actions:${commitment.commitment_id}`,executor_id:'github-actions',executor_revision:process.env.GITHUB_SHA,observed:{status:'EXECUTED',action:commitment.action,payload:commitment.payload,external_issue:{number:issue.number,url:issue.html_url}}};
          const githubReceipt={...githubCore,receipt_hash:sha256(githubCore)};
          const vercelReceipt=vercel.reality_receipt;
          const githubVerify=verifyPortableReceipt(githubReceipt); const vercelVerify=verifyPortableReceipt(vercelReceipt);
          const tampered={...githubReceipt,receipt_hash:'00'.repeat(32)};
          const replayRejected=assertNoReplay([githubReceipt,githubReceipt])===false;
          const checks={shared_commitment_hash:githubReceipt.commitment_hash===vercelReceipt.commitment_hash,github_real_external_action:Number.isInteger(issue.number)&&typeof issue.html_url==='string',github_receipt_accepted:githubVerify.decision==='ACCEPT',vercel_live_executor_accepted:vercelVerify.decision==='ACCEPT',same_portable_verifier_core:githubVerify.decision==='ACCEPT'&&vercelVerify.decision==='ACCEPT',provider_identities_distinct:githubReceipt.executor_id!==vercelReceipt.executor_id,tampered_receipt_rejected:verifyPortableReceipt(tampered).decision==='REJECT',replay_rejected:replayRejected};
          const verdict=Object.values(checks).every(Boolean)?'PASS':'FAIL';
          const receipt={schema:'RNCP-EXECUTION-RECEIPT-v1',rsta:'RSTA-037',protocol:'RNCP-CROSS-PROVIDER-LIVE-v1',commitment,providers:{github:githubReceipt,vercel:vercelReceipt},checks,verdict};
          receipt.content_address=sha256(Object.fromEntries(Object.entries(receipt).filter(([k])=>k!=='content_address')));
          fs.writeFileSync('rsta037-execution-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          fs.writeFileSync('rsta037-final-verdict.json',JSON.stringify({rsta:'RSTA-037',run_id:Number(process.env.GITHUB_RUN_ID),verdict,content_address:receipt.content_address,checks},null,2)+'\n');
          console.log(JSON.stringify({checks,verdict,content_address:receipt.content_address},null,2));
          if(verdict!=='PASS') process.exit(1);
          JS

      - name: Persist evidence by GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in rsta037-execution-receipt.json rsta037-final-verdict.json; do
            body_b64=$(base64 -w 0 "$file")
            path="rsta-evidence/rsta037/${GITHUB_RUN_ID}-${file}"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" -X PUT -f message="rsta: persist RSTA-037 ${file} run ${GITHUB_RUN_ID} [skip ci]" -f content="$body_b64"
          done
