name: RSTA-018 External Executor 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rsta-018-external-executor2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  external-executor-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Execute same Portable Commitment as Executor 1
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          commitment = {
              'protocol_version': 'RNCP-PORTABLE-1',
              'commitment_id': 'RSTA-016-PORTABLE-001',
              'action': 'POSTMAN_ECHO',
              'payload': {'message': 'RSTA-016 external execution'},
          }
          def canonical(v):
              if v is None or not isinstance(v, (dict, list)):
                  return json.dumps(v, separators=(',', ':'), ensure_ascii=False)
              if isinstance(v, list):
                  return '[' + ','.join(canonical(x) for x in v) + ']'
              return '{' + ','.join(json.dumps(k, ensure_ascii=False, separators=(',', ':')) + ':' + canonical(v[k]) for k in sorted(v)) + '}'
          def sha(v):
              return hashlib.sha256(canonical(v).encode()).hexdigest()
          commitment_hash = sha(commitment)
          observed = {'status':'EXECUTED','action':commitment['action'],'payload':commitment['payload']}
          receipt_core = {**commitment,'commitment_hash':commitment_hash,'execution_id':'github-actions-executor2:RSTA-016-PORTABLE-001','executor_id':'github-actions-executor2-rsta018','implementation':'standalone-python-github-actions','executor_repository':'socksninja/-','executor_revision':os.environ.get('GITHUB_SHA','unknown'),'transport':'GITHUB_ACTIONS','observed':observed}
          receipt = {**receipt_core,'decision':'ACCEPT','capability':'EXECUTED'}
          receipt['receipt_hash'] = sha(receipt_core)
          out = {'rsta':'RSTA-018','commitment':commitment,'executor':'github-actions-executor2-rsta018','receipt':receipt,'execution_run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          with open('rsta/rsta018-executor2-live-receipt.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish receipt into repository evidence ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rsta/rsta018-executor2-live-receipt.json
          git commit -m 'rsta: update executor2 receipt for shared portable commitment [skip ci]'
          git push
