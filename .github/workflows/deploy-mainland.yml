name: Deploy Hexbound to Tencent COS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Check deployment secrets
        env:
          TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          missing=0
          for name in TENCENT_CLOUD_SECRET_ID TENCENT_CLOUD_SECRET_KEY COS_BUCKET COS_REGION; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret $name is missing or empty"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All four Tencent COS secrets are present."

      - name: Verify Tencent COS access
        env:
          TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          npm install --no-save cos-nodejs-sdk-v5
          node <<'NODE'
          const COS = require('cos-nodejs-sdk-v5');
          const cos = new COS({
            SecretId: process.env.TENCENT_CLOUD_SECRET_ID,
            SecretKey: process.env.TENCENT_CLOUD_SECRET_KEY,
          });
          cos.headBucket(
            { Bucket: process.env.COS_BUCKET, Region: process.env.COS_REGION },
            (err) => {
              if (err) {
                console.error(JSON.stringify({
                  code: err.code,
                  statusCode: err.statusCode,
                  requestId: err.RequestId,
                  message: err.message,
                }));
                process.exit(1);
              }
              console.log('Tencent COS access verified.');
            },
          );
          NODE

      - name: Upload to Tencent COS
        uses: TencentCloud/cos-action@v1
        with:
          secret_id: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          secret_key: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          cos_bucket: ${{ secrets.COS_BUCKET }}
          cos_region: ${{ secrets.COS_REGION }}
          local_path: out
          remote_path: /
          clean: true

# Retry deployment after rotating Tencent credentials.
