name: RSTA-034 Persistent Delegation Ledger
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ledger-verification:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Run real persistent ledger verification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node rsta/rsta034-live.mjs
      - name: Verify persisted evidence
        run: |
          set -euo pipefail
          node -e "const r=require('./rsta034-execution-receipt.json'); if(r.verdict!=='PASS') process.exit(1); console.log(JSON.stringify(r,null,2))"
      - name: Persist RSTA-034 evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rsta034-execution-receipt.json rsta034-final-verdict.json
          git commit -m 'rsta: persist RSTA-034 execution evidence [skip ci]'
          git fetch origin main
          git rebase origin/main || { git rebase --abort; exit 1; }
          git push origin HEAD:main